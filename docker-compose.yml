services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pipeline
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d pipeline"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: ./apps/api/.env.example
        required: true
      - path: ./apps/api/.env
        required: false
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://pipeline:pipeline@postgres:5432/pipeline?schema=public
      FRONTEND_URL: http://localhost:5173
      CLIENT_URL: http://localhost:5173
      CSRF_SECRET: local-development-csrf-secret
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api/uploads:/workspace/apps/api/uploads

  react:
    build:
      context: .
      dockerfile: apps/react/Dockerfile
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - api

  astro:
    build:
      context: .
      dockerfile: apps/astro/Dockerfile
    ports:
      - "4321:4321"

volumes:
  postgres-data:
